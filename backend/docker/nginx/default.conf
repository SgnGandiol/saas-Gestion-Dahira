# Whitelist of CORS origins — reflected back verbatim (avoids wildcard while staying flexible)
map $http_origin $cors_origin {
    default                     "";
    "http://localhost:3000"     "http://localhost:3000";
    "http://127.0.0.1:3000"    "http://127.0.0.1:3000";
    ~^https?://[a-z0-9\-]+\.sgd\.sn(:\d+)?$ $http_origin;
}

server {
    listen      80;
    server_name localhost;
    root        /var/www/html/public;
    index       index.php index.html;

    access_log  /var/log/nginx/access.log;
    error_log   /var/log/nginx/error.log;

    # ── CORS preflight ───────────────────────────────────────────
    # Answered by Nginx directly — PHP-FPM never involved.
    # This prevents CORS failures when PHP is starting up or returns a 5xx.
    location / {
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin'  $cors_origin always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, PATCH, DELETE' always;
            add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, X-Requested-With, X-Tenant-ID, X-Tenant-Slug, Apollo-Require-Preflight' always;
            add_header 'Access-Control-Max-Age'       86400 always;
            return 204;
        }
        try_files $uri $uri/ /index.php?$query_string;
    }

    # ── PHP-FPM ──────────────────────────────────────────────────
    location ~ \.php$ {
        fastcgi_pass   app:9000;
        fastcgi_index  index.php;
        fastcgi_param  SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include        fastcgi_params;
        fastcgi_read_timeout 120;

        # Safety net: add CORS header on PHP error responses (502, 500…)
        # so the browser can read the error body instead of seeing a CORS block.
        # Laravel's HandleCors adds this header on normal responses; fastcgi_hide_header
        # prevents duplication by stripping PHP's copy before Nginx adds its own.
        fastcgi_hide_header 'Access-Control-Allow-Origin';
        add_header 'Access-Control-Allow-Origin' $cors_origin always;
    }

    # ── Sécurité : bloquer l'accès aux fichiers cachés ───────────
    location ~ /\. {
        deny all;
    }

    # ── Cache statique ───────────────────────────────────────────
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
