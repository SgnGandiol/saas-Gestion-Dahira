; ── PHP-FPM pool configuration ───────────────────────────────
[www]
user  = www-data
group = www-data

listen = 0.0.0.0:9000

; Taille du pool adaptée au développement
pm                   = dynamic
pm.max_children      = 20
pm.start_servers     = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 5
pm.max_requests      = 500

; Logs
access.log           = /proc/self/fd/2
php_flag[display_errors] = on
