"Datetime scalar"
scalar DateTime @scalar(class: "Nuwave\\Lighthouse\\Schema\\Types\\Scalars\\DateTime")
"Date scalar (Y-m-d)"
scalar Date @scalar(class: "Nuwave\\Lighthouse\\Schema\\Types\\Scalars\\Date")

# ─────────────────────────────────────────────────────────────
#  QUERIES
# ─────────────────────────────────────────────────────────────
type Query {
    # Auth
    me: User @auth @guard(with: ["sanctum"])

    # Dahira
    dahira(id: ID! @eq): Dahira @find @guard(with: ["sanctum"])
    dahiras: [Dahira!]! @all @guard(with: ["sanctum"])

    # Membres
    members(dahira_id: ID! @eq, is_active: Boolean @eq): [Member!]!
        @paginate(defaultCount: 20) @guard(with: ["sanctum"])

    member(id: ID! @eq): Member @find @guard(with: ["sanctum"])

    # Catégories de membres
    memberCategories(dahira_id: ID! @eq): [MemberCategory!]!
        @all @guard(with: ["sanctum"])

    # Maisons
    houses(dahira_id: ID! @eq): [House!]!
        @paginate(defaultCount: 20) @guard(with: ["sanctum"])

    # Rotations
    rotations(dahira_id: ID! @eq, status: RotationStatus @eq): [Rotation!]!
        @paginate(defaultCount: 20) @guard(with: ["sanctum"])

    # Finance
    contributions(dahira_id: ID! @eq, member_id: ID @eq, event_id: ID @eq): [Contribution!]!
        @paginate(defaultCount: 20) @guard(with: ["sanctum"])

    expenses(dahira_id: ID! @eq): [Expense!]!
        @paginate(defaultCount: 20) @guard(with: ["sanctum"])

    # Événements
    events(dahira_id: ID! @eq, status: EventStatus @eq): [DahiraEvent!]!
        @paginate(defaultCount: 50) @guard(with: ["sanctum"])

    event(id: ID! @eq): DahiraEvent @find @guard(with: ["sanctum"])

    # Dashboard
    dashboardStats(dahira_id: ID!): DashboardStats!
        @guard(with: ["sanctum"])
        @field(resolver: "App\\GraphQL\\Queries\\DashboardQuery@stats")

    # Suggestion rotation automatique
    suggestNextHouse(dahira_id: ID!, scheduled_date: Date!): House
        @guard(with: ["sanctum"])
        @field(resolver: "App\\GraphQL\\Queries\\RotationSuggestionQuery@suggest")

    # Cascade (dry-run)
    previewCascade(from_rotation_id: ID!, mode: CascadeMode!, shift_weeks: Int): CascadePreview!
        @guard(with: ["sanctum"])
        @field(resolver: "App\\GraphQL\\Queries\\RotationCascadeQuery@preview")

    # Moteur de rotation intelligent
    rotationLogs(rotation_id: ID!): [RotationLog!]!
        @guard(with: ["sanctum"])
        @field(resolver: "App\\GraphQL\\Queries\\RotationEngineQuery@logs")

    suggestBestSolution(rotation_id: ID!, reason: String!): RotationSuggestionResult!
        @guard(with: ["sanctum"])
        @field(resolver: "App\\GraphQL\\Queries\\RotationEngineQuery@suggestSolution")

    previewRebuild(dahira_id: ID!, from: Date!, weeks: Int!, mode: RebuildMode): RebuildPreview!
        @guard(with: ["sanctum"])
        @field(resolver: "App\\GraphQL\\Queries\\RotationEngineQuery@previewRebuild")
}

# ─────────────────────────────────────────────────────────────
#  MUTATIONS
# ─────────────────────────────────────────────────────────────
type Mutation {
    # ── Auth ────────────────────────────────────────────────
    login(email: String! @rules(apply: ["email"]), password: String!): AuthPayload!
        @field(resolver: "App\\GraphQL\\Mutations\\AuthMutation@login")

    register(
        name: String!
        email: String! @rules(apply: ["email", "unique:users,email"])
        password: String! @rules(apply: ["min:8"])
        dahira_name: String!
        city: String
    ): AuthPayload!
        @guard(with: ["sanctum"])
        @field(resolver: "App\\GraphQL\\Mutations\\AuthMutation@register")

    logout: Boolean! @guard(with: ["sanctum"])
        @field(resolver: "App\\GraphQL\\Mutations\\AuthMutation@logout")

    # ── Dahiras ──────────────────────────────────────────────
    createDahira(input: CreateDahiraInput! @spread): CreateDahiraPayload!
        @guard(with: ["sanctum"])
        @field(resolver: "App\\GraphQL\\Mutations\\DahiraMutation@create")

    updateDahira(id: ID!, input: UpdateDahiraInput! @spread): Dahira!
        @update @guard(with: ["sanctum"])

    deleteDahira(id: ID!): Dahira @delete @guard(with: ["sanctum"])

    # ── Membres ──────────────────────────────────────────────
    createMember(input: CreateMemberInput! @spread): Member!
        @create @guard(with: ["sanctum"])

    updateMember(id: ID!, input: UpdateMemberInput! @spread): Member!
        @update @guard(with: ["sanctum"])

    deleteMember(id: ID!): Member @delete @guard(with: ["sanctum"])

    # ── Catégories de membres ─────────────────────────────────
    createMemberCategory(input: CreateMemberCategoryInput! @spread): MemberCategory!
        @create @guard(with: ["sanctum"])

    updateMemberCategory(id: ID!, input: UpdateMemberCategoryInput! @spread): MemberCategory!
        @update @guard(with: ["sanctum"])

    deleteMemberCategory(id: ID!): MemberCategory @delete @guard(with: ["sanctum"])

    # ── Maisons ──────────────────────────────────────────────
    createHouse(input: CreateHouseInput! @spread): House!
        @create @guard(with: ["sanctum"])

    updateHouse(id: ID!, input: UpdateHouseInput! @spread): House!
        @update @guard(with: ["sanctum"])

    deleteHouse(id: ID!): House @delete @guard(with: ["sanctum"])

    # ── Rotations ────────────────────────────────────────────
    scheduleRotation(dahira_id: ID!, scheduled_date: Date!, member_id: ID!, house_id: ID, force_rebuild: Boolean, insert_mode: Boolean, notes: String): ScheduleRotationPayload!
        @guard(with: ["sanctum"])
        @field(resolver: "App\\GraphQL\\Mutations\\RotationMutation@schedule")

    autoScheduleRotation(dahira_id: ID!, scheduled_date: Date!): Rotation!
        @guard(with: ["sanctum"])
        @field(resolver: "App\\GraphQL\\Mutations\\RotationMutation@autoSchedule")

    schedulePeriodRotations(dahira_id: ID!, start_date: Date!, end_date: Date!): SchedulePeriodPayload!
        @guard(with: ["sanctum"])
        @field(resolver: "App\\GraphQL\\Mutations\\RotationMutation@schedulePeriod")

    updateRotationStatus(id: ID!, status: RotationStatus!): Rotation!
        @guard(with: ["sanctum"])
        @field(resolver: "App\\GraphQL\\Mutations\\RotationMutation@updateStatus")

    rescheduleRotation(id: ID!, scheduled_date: Date, mode: CascadeMode!, shift_weeks: Int, motif: RotationMotif!, motif_detail: String): CascadeResult!
        @guard(with: ["sanctum"])
        @field(resolver: "App\\GraphQL\\Mutations\\RotationCascadeMutation@reschedule")

    cancelRotation(id: ID!, mode: CascadeMode!, motif: RotationMotif!, motif_detail: String): CascadeResult!
        @guard(with: ["sanctum"])
        @field(resolver: "App\\GraphQL\\Mutations\\RotationCascadeMutation@cancel")

    # ── Assignations ─────────────────────────────────────────
    createAssignment(input: CreateAssignmentInput! @spread): Assignment!
        @create @guard(with: ["sanctum"])

    toggleAssignment(id: ID!): Assignment!
        @guard(with: ["sanctum"])
        @field(resolver: "App\\GraphQL\\Mutations\\AssignmentMutation@toggle")

    deleteAssignment(id: ID!): Assignment @delete @guard(with: ["sanctum"])

    # ── Finance ──────────────────────────────────────────────
    recordContribution(input: CreateContributionInput! @spread): Contribution!
        @create @guard(with: ["sanctum"])

    createExpense(input: CreateExpenseInput! @spread): Expense!
        @create @guard(with: ["sanctum"])

    # ── Moteur de rotation intelligent ───────────────────────
    updateMemberAvailability(id: ID!, availability_status: MemberAvailabilityStatus!): Member!
        @guard(with: ["sanctum"])
        @field(resolver: "App\\GraphQL\\Mutations\\RotationEngineMutation@updateAvailability")

    applyRebuild(preview: RebuildPreviewInput!): [Rotation!]!
        @guard(with: ["sanctum"])
        @field(resolver: "App\\GraphQL\\Mutations\\RotationEngineMutation@applyRebuild")

    cancelRebuild(rebuild_id: ID!): Boolean!
        @guard(with: ["sanctum"])
        @field(resolver: "App\\GraphQL\\Mutations\\RotationEngineMutation@cancelRebuild")

    applyRotationSolution(rotation_id: ID!, solution_type: String!, meta: String): Rotation!
        @guard(with: ["sanctum"])
        @field(resolver: "App\\GraphQL\\Mutations\\RotationEngineMutation@applySolution")

    # ── Événements ───────────────────────────────────────────
    createEvent(input: CreateEventInput! @spread): DahiraEvent!
        @guard(with: ["sanctum"])
        @field(resolver: "App\\GraphQL\\Mutations\\EventMutation@create")

    updateEvent(id: ID!, input: UpdateEventInput! @spread): DahiraEvent!
        @guard(with: ["sanctum"])
        @field(resolver: "App\\GraphQL\\Mutations\\EventMutation@update")

    closeEvent(id: ID!): DahiraEvent!
        @guard(with: ["sanctum"])
        @field(resolver: "App\\GraphQL\\Mutations\\EventMutation@close")

    deleteEvent(id: ID!): DahiraEvent!
        @guard(with: ["sanctum"])
        @field(resolver: "App\\GraphQL\\Mutations\\EventMutation@delete")
}

# ─────────────────────────────────────────────────────────────
#  TYPES
# ─────────────────────────────────────────────────────────────

type ScheduleRotationPayload {
    rotation: Rotation!
    replaced_rotation: Rotation
    rebuild_applied: Boolean!
    rebuild_count: Int!
}

type SchedulePeriodPayload {
    rotations: [Rotation!]!
    created_count: Int!
    skipped_dates: [String!]!
    skipped_count: Int!
}

type AuthPayload {
    token: String!
    user: User!
}

type CreateDahiraPayload {
    dahira: Dahira!
    admin_email: String!
    admin_password: String!
}

type DashboardStats {
    active_members_count: Int!
    houses_count: Int!
    next_rotation: Rotation
    monthly_contributions: Float!
    monthly_expenses: Float!
    balance: Float!
}

type User {
    id: ID!
    name: String!
    email: String!
    dahira: Dahira @belongsTo
    member: Member @hasOne
    roles: [String!]!
        @method(name: "getRoleNames")
    created_at: DateTime!
    updated_at: DateTime!
}

type Dahira {
    id: ID!
    name: String!
    slug: String!
    city: String
    country: String!
    phone: String
    email: String
    logo: String
    description: String
    is_active: Boolean!
    members: [Member!]! @hasMany
    houses: [House!]! @hasMany
    rotations: [Rotation!]! @hasMany
    created_at: DateTime!
    updated_at: DateTime!
}

type MemberCategory {
    id: ID!
    dahira: Dahira! @belongsTo
    name: String!
    label: String!
    weekly_amount: Float!
    color: String!
    is_default: Boolean!
    sort_order: Int!
    members: [Member!]! @hasMany
    created_at: DateTime!
    updated_at: DateTime!
}

type Member {
    id: ID!
    dahira: Dahira! @belongsTo
    house: House @belongsTo
    category: MemberCategory @belongsTo(relation: "category")
    user: User @belongsTo
    first_name: String!
    last_name: String!
    full_name: String! @method(name: "getFullNameAttribute")
    phone: String
    email: String
    gender: Gender!
    profession: String
    joined_at: Date
    is_active: Boolean!
    notes: String
    photo_url: String
    availability_status: MemberAvailabilityStatus!
    absence_frequency: Int!
    priority_score: Float!
    contributions: [Contribution!]! @hasMany
    assignments: [Assignment!]! @hasMany
    created_at: DateTime!
    updated_at: DateTime!
}

type House {
    id: ID!
    dahira: Dahira! @belongsTo
    label: String
    address: String!
    neighborhood: String
    capacity: Int!
    is_available: Boolean!
    is_headquarters: Boolean!
    min_interval_weeks: Int!
    total_received: Int!
    last_received_at: Date
    members: [Member!]! @hasMany
    rotations: [Rotation!]! @hasMany
    created_at: DateTime!
    updated_at: DateTime!
}

type Rotation {
    id: ID!
    dahira: Dahira! @belongsTo
    house: House! @belongsTo
    member: Member @belongsTo
    scheduled_date: Date!
    status: RotationStatus!
    attendees_count: Int
    notes: String
    assignments: [Assignment!]! @hasMany
    created_at: DateTime!
    updated_at: DateTime!
}

type Contribution {
    id: ID!
    dahira: Dahira! @belongsTo
    member: Member! @belongsTo
    event: DahiraEvent @belongsTo(relation: "event")
    type: ContributionType!
    amount: Float!
    paid_at: Date!
    period: String
    status: ContributionStatus!
    notes: String
    created_at: DateTime!
    updated_at: DateTime!
}

type DahiraEvent {
    id: ID!
    dahira: Dahira! @belongsTo
    name: String!
    type: EventType!
    target_amount: Float
    deadline: Date
    color: String!
    status: EventStatus!
    description: String
    category_amounts: [EventCategoryAmount!]! @hasMany(relation: "categoryAmounts")
    contributions: [Contribution!]! @hasMany
    total_collected: Float! @method(name: "getTotalCollected")
    created_at: DateTime!
    updated_at: DateTime!
}

type EventCategoryAmount {
    id: ID!
    event: DahiraEvent! @belongsTo
    category: MemberCategory! @belongsTo(relation: "category")
    amount: Float!
}

type Expense {
    id: ID!
    dahira: Dahira! @belongsTo
    user: User @belongsTo
    label: String!
    category: ExpenseCategory!
    amount: Float!
    spent_at: Date!
    notes: String
    created_at: DateTime!
    updated_at: DateTime!
}

type Assignment {
    id: ID!
    dahira: Dahira! @belongsTo
    rotation: Rotation! @belongsTo
    member: Member! @belongsTo
    task: TaskType!
    completed: Boolean!
    notes: String
    created_at: DateTime!
    updated_at: DateTime!
}

# ─────────────────────────────────────────────────────────────
#  ENUMS
# ─────────────────────────────────────────────────────────────

enum Gender {
    male
    female
}

enum RotationStatus {
    planned
    confirmed
    ongoing
    completed
    cancelled
    rescheduled
    headquarters
}

enum MemberAvailabilityStatus {
    available
    unavailable
    travel
    sick
    suspended
}

enum ContributionType {
    cotisation
    adiya
    don
    autre
}

enum ContributionStatus {
    pending
    paid
    partial
}

enum EventType {
    thiant
    ziar
    gamou
    social
    autre
}

enum EventStatus {
    active
    closed
}

enum ExpenseCategory {
    nourriture
    transport
    materiel
    communication
    autre
}

enum TaskType {
    lecture_khassaides
    accueil
    the_cafe
    sonorisation
    nettoyage
    caisse
    communication
}

# ─────────────────────────────────────────────────────────────
#  INPUTS
# ─────────────────────────────────────────────────────────────

input CreateDahiraInput {
    name: String! @rules(apply: ["min:2", "max:150"])
    city: String @rules(apply: ["nullable", "max:100"])
    country: String @rules(apply: ["nullable", "max:100"])
    phone: String @rules(apply: ["nullable", "regex:/^[+0-9\\s\\-]{7,20}$/"])
    email: String @rules(apply: ["nullable", "email"])
    description: String @rules(apply: ["nullable", "max:1000"])
    is_active: Boolean
    # Compte admin du Dahira
    admin_name: String @rules(apply: ["required", "min:2", "max:150"])
    admin_email: String @rules(apply: ["required", "email", "unique:users,email"])
    admin_password: String @rules(apply: ["required", "min:8"])
}

input UpdateDahiraInput {
    name: String @rules(apply: ["min:2", "max:150"])
    city: String @rules(apply: ["nullable", "max:100"])
    country: String @rules(apply: ["nullable", "max:100"])
    phone: String @rules(apply: ["nullable", "regex:/^[+0-9\\s\\-]{7,20}$/"])
    email: String @rules(apply: ["nullable", "email"])
    description: String @rules(apply: ["nullable", "max:1000"])
    is_active: Boolean
}

input CreateMemberInput {
    dahira_id: ID!
    house_id: ID
    member_category_id: ID
    first_name: String! @rules(apply: ["min:2", "max:100"])
    last_name: String! @rules(apply: ["min:2", "max:100"])
    phone: String @rules(apply: ["nullable", "regex:/^[+0-9\\s\\-]{7,20}$/"])
    email: String @rules(apply: ["nullable", "email", "unique:members,email"])
    gender: Gender
    profession: String @rules(apply: ["nullable", "max:100"])
    joined_at: Date
    notes: String @rules(apply: ["nullable", "max:1000"])
}

input UpdateMemberInput {
    house_id: ID
    member_category_id: ID
    first_name: String @rules(apply: ["min:2", "max:100"])
    last_name: String @rules(apply: ["min:2", "max:100"])
    phone: String @rules(apply: ["nullable", "regex:/^[+0-9\\s\\-]{7,20}$/"])
    email: String @rules(apply: ["nullable", "email"])
    gender: Gender
    profession: String @rules(apply: ["nullable", "max:100"])
    is_active: Boolean
    photo_url: String
    notes: String @rules(apply: ["nullable", "max:1000"])
    availability_status: MemberAvailabilityStatus
}

input CreateHouseInput {
    dahira_id: ID!
    label: String @rules(apply: ["nullable", "max:150"])
    address: String! @rules(apply: ["min:5", "max:255"])
    neighborhood: String @rules(apply: ["nullable", "max:100"])
    capacity: Int @rules(apply: ["nullable", "integer", "min:1", "max:10000"])
    min_interval_weeks: Int @rules(apply: ["nullable", "integer", "min:1", "max:52"])
}

input UpdateHouseInput {
    label: String @rules(apply: ["nullable", "max:150"])
    address: String @rules(apply: ["nullable", "min:5", "max:255"])
    neighborhood: String @rules(apply: ["nullable", "max:100"])
    capacity: Int @rules(apply: ["nullable", "integer", "min:1", "max:10000"])
    min_interval_weeks: Int @rules(apply: ["nullable", "integer", "min:1", "max:52"])
    is_available: Boolean
    is_headquarters: Boolean
}

input CreateAssignmentInput {
    dahira_id: ID!
    rotation_id: ID!
    member_id: ID!
    task: TaskType!
    notes: String
}

input CreateContributionInput {
    dahira_id: ID!
    member_id: ID!
    event_id: ID
    type: ContributionType! @rules(apply: ["required"])
    amount: Float! @rules(apply: ["numeric", "min:0.01"])
    paid_at: Date!
    period: String @rules(apply: ["nullable", "max:20"])
    status: ContributionStatus! @rules(apply: ["required"])
    notes: String @rules(apply: ["nullable", "max:1000"])
}

input CreateEventInput {
    dahira_id: ID!
    name: String! @rules(apply: ["min:2", "max:150"])
    type: EventType!
    target_amount: Float @rules(apply: ["nullable", "numeric", "min:0"])
    deadline: Date
    color: String @rules(apply: ["nullable", "max:20"])
    description: String @rules(apply: ["nullable", "max:1000"])
    category_amounts: [EventCategoryAmountInput!]
}

input UpdateEventInput {
    name: String @rules(apply: ["min:2", "max:150"])
    type: EventType
    target_amount: Float @rules(apply: ["nullable", "numeric", "min:0"])
    deadline: Date
    color: String @rules(apply: ["nullable", "max:20"])
    description: String @rules(apply: ["nullable", "max:1000"])
    category_amounts: [EventCategoryAmountInput!]
}

input EventCategoryAmountInput {
    member_category_id: ID!
    amount: Float!
}

input CreateExpenseInput {
    dahira_id: ID!
    label: String! @rules(apply: ["min:2", "max:255"])
    category: ExpenseCategory! @rules(apply: ["required"])
    amount: Float! @rules(apply: ["numeric", "min:0.01"])
    spent_at: Date!
    notes: String @rules(apply: ["nullable", "max:1000"])
}

input CreateMemberCategoryInput {
    dahira_id: ID!
    name: String! @rules(apply: ["min:2", "max:50"])
    label: String! @rules(apply: ["min:2", "max:100"])
    weekly_amount: Float @rules(apply: ["nullable", "numeric", "min:0"])
    color: String @rules(apply: ["nullable", "max:20"])
    sort_order: Int @rules(apply: ["nullable", "integer", "min:0"])
}

input UpdateMemberCategoryInput {
    dahira_id: ID
    name: String @rules(apply: ["min:2", "max:50"])
    label: String @rules(apply: ["min:2", "max:100"])
    weekly_amount: Float @rules(apply: ["nullable", "numeric", "min:0"])
    color: String @rules(apply: ["nullable", "max:20"])
    sort_order: Int @rules(apply: ["nullable", "integer", "min:0"])
}

# ── Rotation Engine — Types ────────────────────────────────────

type RotationLog {
    id: ID!
    rotation_id: ID!
    dahira_id: ID!
    action: String!
    meta: String
    created_at: DateTime!
    created_by_name: String!
}

type RebuildPreviewItem {
    rotation_id: ID!
    date: String!
    old_member_id: ID
    old_member_name: String
    old_house_id: ID
    old_house_label: String
    new_member_id: ID
    new_member_name: String
    new_house_id: ID
    new_house_label: String
    change_type: String!
}

type RebuildLockedItem {
    rotation_id: ID!
    date: String!
    member_name: String
    house_label: String
}

type RebuildMeta {
    mode: String!
    from: String!
    to: String!
    total_rotations: Int!
    changed: Int!
    unchanged: Int!
    stability_pct: Float!
}

type RebuildPreview {
    locked: [RebuildLockedItem!]!
    preview: [RebuildPreviewItem!]!
    meta: RebuildMeta!
}

type RotationSolutionItem {
    type: String!
    label: String!
    date: String
    house_id: ID
    member_id: ID
    rotation_a_id: ID
    rotation_b_id: ID
    _score: Float
}

type RotationSuggestionResult {
    gravity: String!
    confidence: String!
    score: Float!
    recommended_solution: String!
    confidence_score: Float!
    all_solutions: [RotationSolutionItem!]!
}

# ── Cascade — Enums ───────────────────────────────────────────

enum CascadeMode {
    HEADQUARTERS
    CHAIN
    SWAP
    GAP
    FILL
    INSERT
    REPLACE
}

enum RotationMotif {
    ABSENCE
    SICKNESS
    TRAVEL
    DEATH
    WEDDING
    RAMADAN
    MAGAL
    GAMOU
    RELIGIOUS_EVENT
    FLOOD
    LOGISTICS
    PLANNING_ERROR
    REBALANCE
    OTHER
}

# ── Cascade — Types ────────────────────────────────────────────

type CascadePreviewItem {
    rotation_id: ID!
    member_name: String
    house_label: String
    old_date: Date!
    new_date: Date!
    is_locked: Boolean!
}

type CascadeMeta {
    mode: String!
    total_affected: Int!
    locked_skipped: Int!
    shift_weeks: Int
}

type CascadePreview {
    items: [CascadePreviewItem!]!
    meta: CascadeMeta!
    has_locked_warning: Boolean!
}

type CascadeResult {
    applied_count: Int!
    skipped_locked: Int!
    headquarters_rotation: Rotation
    rotations: [Rotation!]!
}

# ── Rotation Engine — Enums ────────────────────────────────────

enum RebuildMode {
    balanced
    stable
    geographic
    urgent
}

# ── Rotation Engine — Inputs ───────────────────────────────────

input RebuildPreviewItemInput {
    rotation_id: ID!
    date: String!
    old_member_id: ID
    new_member_id: ID
    old_house_id: ID
    new_house_id: ID
    change_type: String!
}

input RebuildMetaInput {
    mode: String!
    from: String!
    to: String!
    total_rotations: Int!
    changed: Int!
    unchanged: Int!
    stability_pct: Float!
}

input RebuildPreviewInput {
    locked: [String!]
    preview: [RebuildPreviewItemInput!]!
    meta: RebuildMetaInput!
}
